# ════════════════════════════════════════════════════════════════════
#  bat.conf — single source of truth for bat's behaviour.
#  Loaded via $BAT_CONFIG_PATH (exported in modules/00-env.zsh).
#  Lives in-repo, so the config is portable and $HOME stays clean.
#
#  Every bat invocation reads this file: direct `bat` calls and the bat
#  previews inside the fzf pickers (fe / fco) all behave identically.
#  That consistency is why this is a config file rather than flags
#  scattered across aliases.
# ════════════════════════════════════════════════════════════════════

# ── No pager, ever, by default ─────────────────────────────────────
# Output goes straight to stdout instead of dropping into a pager.
# To page on demand: `bat --paging=always <file>` (aliased as `batp`).
--paging=never

# ── Style: PLAIN — syntax colour only, no decorations ──────────────
# This is deliberate and it is the most important line in this file.
#
# Decorations (line numbers, the git-change gutter, the filename
# header) are *baked into stdout as text*. That means every time you
# select terminal output with the mouse to copy a snippet, you also
# copy the line numbers and gutter marks, and then have to strip them
# by hand. Plain output is copy-paste-safe by construction.
#
# When you actively WANT the decorated view, ask for it explicitly:
#   batn <file>    numbers + git change gutter + filename header
# See modules/60-aliases.zsh.
--style="plain"

# ── Theme ──────────────────────────────────────────────────────────
# 'ansi' uses the terminal's own 16-colour palette, so bat matches
# whatever terminal theme is in use and needs no per-theme tuning.
--theme="ansi"

# ── Tabs rendered as 4 spaces (consistent code display) ────────────
--tabs=4

# ── Map extensionless / non-obvious filenames to a syntax ──────────
--map-syntax=".zshrc:Bourne Again Shell (bash)"
--map-syntax="*.zsh:Bourne Again Shell (bash)"
--map-syntax=".gitignore:Git Ignore"
--map-syntax="Dockerfile*:Dockerfile"
