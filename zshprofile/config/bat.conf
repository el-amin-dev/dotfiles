# ════════════════════════════════════════════════════════════════════
#  bat.conf — single source of truth for bat behavior
#  Loaded via $BAT_CONFIG_PATH (set in modules/00-env.zsh).
#  Lives in-repo → portable, $HOME stays clean.
#
#  Every bat invocation reads this: the `cat` alias, `catt`, and the
#  bat previews inside the fzf functions (fe / fco / fcd) all behave
#  identically. That consistency is the reason this is a config file
#  and not flags scattered across aliases.
# ════════════════════════════════════════════════════════════════════

# ── No pager, ever, by default ─────────────────────────────────────
# You don't want bat dumping you into a pager. This makes bat behave
# like a drop-in `cat` (just colored) — output goes straight to stdout.
# To page on demand explicitly: `bat --paging=always <file>`.
--paging=never

# ── Style: line numbers + git change gutter + header ───────────────
# 'changes' is the piece that draws the +/~/│ markers in the left
# gutter (added / modified / context) — the git-diff signs you wanted.
# 'numbers' = line numbers. 'header' = filename bar at the top.
--style="numbers,changes,header"

# ── Theme ──────────────────────────────────────────────────────────
# 'ansi' uses your terminal's own 16-color palette, so bat matches
# whatever terminal theme you run (Yaru-dark here) and stays fast.
--theme="ansi"

# ── Tabs rendered as 4 spaces (consistent code display) ────────────
--tabs=4

# ── Map a few extensionless/odd filenames to sensible syntaxes ─────
--map-syntax=".zshrc:Bourne Again Shell (bash)"
--map-syntax="*.zsh:Bourne Again Shell (bash)"
--map-syntax=".gitignore:Git Ignore"
--map-syntax="Dockerfile*:Dockerfile"
